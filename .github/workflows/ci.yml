name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Server unit tests
        run: npm run test:server

      - name: Client unit tests
        run: npm run test:client

      - name: TypeScript check (client)
        working-directory: client
        run: npx tsc --noEmit

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build H5
        run: npm run build:h5

      - name: Build WeChat mini-program
        working-directory: client
        run: npm run build:mp-weixin

      - name: E2E — H5 full journey (MOCK_AI backend, auto-spawned)
        run: npm run test:e2e:h5
        env:
          E2E_BROWSER: /usr/bin/google-chrome
        timeout-minutes: 15

      - name: E2E — Multi-client room journey (MOCK_AI, dual WS)
        run: node e2e/multiroom.journey.mjs
        timeout-minutes: 10

      - name: E2E — Rooms browser journey (MOCK_AI, dual browser contexts)
        run: node e2e/rooms.journey.mjs
        env:
          E2E_BROWSER: /usr/bin/google-chrome
        timeout-minutes: 15

      - name: E2E — Room stress (≤100 rooms boundary, MOCK_AI)
        run: node e2e/room-stress.mjs
        env:
          STRESS_ROOMS: "50"
        timeout-minutes: 10

      - name: Upload E2E artifacts (screenshots + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/screenshots/
            e2e/final-e2e.log
          if-no-files-found: ignore
